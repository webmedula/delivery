# Produção no VPS. O app escuta só em 127.0.0.1:3010; quem atende a internet
# é o OpenLiteSpeed do CyberPanel, que faz proxy para essa porta (ver deploy/README.md).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://delivery:${POSTGRES_PASSWORD}@db:5432/delivery
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: delivery
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
